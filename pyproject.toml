[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtqw-parrondo"
version = "0.1.0"
description = "Parrondo transport in single-qubit coined DTQWs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Lim Yu Kang"}]
dependencies = [
  "numpy",
  "matplotlib",
  "PyYAML",
  "tqdm",
  "pytest",
  "pandas",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dtqw*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
